    applicability: Nonprestressed beam; required Vs does not exceed 0.33*sqrt(fc')*bw*d.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    notes: Maximum spacing component 600 mm; required Vs is reconstructed from ETABS Av/s using 22.5.8.5.3; SI units.
  - rule_id: ACI318_25_9_7_6_2_2_HIGH_D_LIMIT
    module: rc_shear_torsion.codes.aci318_25.shear
