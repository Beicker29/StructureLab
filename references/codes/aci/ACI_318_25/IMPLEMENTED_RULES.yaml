    notes: Maximum spacing component d/4; required Vs is reconstructed from ETABS Av/s using 22.5.8.5.3; SI units.
  - rule_id: ACI318_25_9_7_6_2_2_HIGH_ABSOLUTE_LIMIT
    module: rc_shear_torsion.codes.aci318_25.shear
    function: maximum_shear_spacing_limits
