  - rule_id: ACI318_25_9_7_6_3_1_CLOSED_STIRRUP
    module: rc_shear_torsion.codes.aci318_25.torsion
    function: check_closed_stirrup_for_torsion
    aci_section: "9.7.6.3.1"
    applicability: At least one physical demand scenario has active torsion.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    notes: The current exterior transverse component represents a closed stirrup.
  - rule_id: ACI318_25_9_7_6_3_3_PH_OVER_8
    module: rc_shear_torsion.codes.aci318_25.torsion
    function: torsion_spacing_limits
    aci_section: "9.7.6.3.3"
    applicability: Active torsion and available closed-stirrup geometry.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    notes: Maximum spacing component ph/8 using the centerline perimeter of the exterior closed stirrup; inactive torsion is NOT_APPLICABLE.
