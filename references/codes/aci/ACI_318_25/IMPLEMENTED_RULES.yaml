    aci_section: "18.6.4.4(a)"
    applicability: DES confined region where hoops are required by 18.6.4.1.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    notes: Maximum spacing component d/4.
  - rule_id: ACI318_25_18_6_4_4_ABSOLUTE_150
    module: rc_shear_torsion.codes.aci318_25.seismic
    function: seismic_spacing_limits
    aci_section: "18.6.4.4(b)"
    applicability: DES confined region where hoops are required by 18.6.4.1.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    notes: Maximum spacing component 150 mm.
  - rule_id: ACI318_25_18_6_4_4_SIX_DB_GRADE_420
    module: rc_shear_torsion.codes.aci318_25.seismic
    function: seismic_spacing_limits
    aci_section: "18.6.4.4(c)"
    applicability: DES confined region with Grade 420 primary flexural reinforcement.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    notes: Maximum spacing component 6db of the smallest primary flexural bar, excluding skin reinforcement.
  - rule_id: ACI318_25_18_6_4_4_FIVE_DB_GRADE_550
    module: rc_shear_torsion.codes.aci318_25.seismic
