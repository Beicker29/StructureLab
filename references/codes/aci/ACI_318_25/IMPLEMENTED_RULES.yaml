code_id: ACI_318_25
rules:
  - rule_id: ACI318_25_9_6_4_2_COMBINED_TRANSVERSE_MINIMUM
    module: rc_shear_torsion.codes.aci318_25.torsion
    function: check_minimum_transverse_reinforcement_for_torsion
    aci_section: "9.6.4.2"
    applicability: Torsional reinforcement is required by at least one physical demand scenario.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    notes: Greater of the two SI expressions; required and provided values are reported in mm2/m.
  - rule_id: ACI318_25_9_7_5_1_LONGITUDINAL_TORSION_DISTRIBUTION
    module: rc_shear_torsion.codes.aci318_25.longitudinal_torsion
    function: longitudinal_torsion_bar_spacing_mm
    aci_section: "9.7.5.1"
    applicability: Longitudinal torsional reinforcement is required; StructureLab designs intermediate bars symmetrically on the two side faces.
    implemented: true
    tested: true
    test_file: tests/test_pre_phase4_longitudinal_audit.py
    notes: Existing top and bottom flexural bars delimit Lv but are not counted in torsional area or N; sL=Lv/(N/2+1), maximum 300 mm.
  - rule_id: ACI318_25_9_7_5_2_LONGITUDINAL_TORSION_BAR_DIAMETER
    module: rc_shear_torsion.codes.aci318_25.longitudinal_torsion
    function: minimum_longitudinal_torsion_bar_diameter_mm
    aci_section: "9.7.5.2"
    applicability: Longitudinal torsional reinforcement is required.
    implemented: true
    tested: true
    test_file: tests/test_pre_phase4_longitudinal_audit.py
    notes: Minimum diameter is max(0.042 times selected transverse spacing, 10 mm); checked for base and additional torsional bars.
  - rule_id: ACI318_25_9_7_6_2_2_LOW_D_LIMIT
    module: rc_shear_torsion.codes.aci318_25.shear
    function: maximum_shear_spacing_limits
    aci_section: "9.7.6.2.2, Table 9.7.6.2.2; 22.5.8.5.3"
    applicability: Nonprestressed beam; required Vs does not exceed 0.33*sqrt(fc')*bw*d.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    notes: Maximum spacing component d/2; required Vs is reconstructed from ETABS Av/s using 22.5.8.5.3; SI units.
  - rule_id: ACI318_25_9_7_6_2_2_LOW_ABSOLUTE_LIMIT
    module: rc_shear_torsion.codes.aci318_25.shear
    function: maximum_shear_spacing_limits
    aci_section: "9.7.6.2.2, Table 9.7.6.2.2; 22.5.8.5.3"
    applicability: Nonprestressed beam; required Vs does not exceed 0.33*sqrt(fc')*bw*d.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    notes: Maximum spacing component 600 mm; required Vs is reconstructed from ETABS Av/s using 22.5.8.5.3; SI units.
  - rule_id: ACI318_25_9_7_6_2_2_HIGH_D_LIMIT
    module: rc_shear_torsion.codes.aci318_25.shear
    function: maximum_shear_spacing_limits
    aci_section: "9.7.6.2.2, Table 9.7.6.2.2; 22.5.8.5.3"
    applicability: Nonprestressed beam; required Vs exceeds 0.33*sqrt(fc')*bw*d.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    notes: Maximum spacing component d/4; required Vs is reconstructed from ETABS Av/s using 22.5.8.5.3; SI units.
  - rule_id: ACI318_25_9_7_6_2_2_HIGH_ABSOLUTE_LIMIT
    module: rc_shear_torsion.codes.aci318_25.shear
    function: maximum_shear_spacing_limits
    aci_section: "9.7.6.2.2, Table 9.7.6.2.2; 22.5.8.5.3"
    applicability: Nonprestressed beam; required Vs exceeds 0.33*sqrt(fc')*bw*d.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    notes: Maximum spacing component 300 mm; required Vs is reconstructed from ETABS Av/s using 22.5.8.5.3; SI units.
  - rule_id: ACI318_25_9_7_6_3_1_CLOSED_STIRRUP
    module: rc_shear_torsion.codes.aci318_25.torsion
    function: check_closed_stirrup_for_torsion
    aci_section: "9.7.6.3.1"
    applicability: At least one physical demand scenario has active torsion.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    notes: The current exterior transverse component represents a closed stirrup.
  - rule_id: ACI318_25_9_7_6_3_3_PH_OVER_8
    module: rc_shear_torsion.codes.aci318_25.torsion
    function: torsion_spacing_limits
    aci_section: "9.7.6.3.3"
    applicability: Active torsion and available closed-stirrup geometry.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    notes: Maximum spacing component ph/8 using the centerline perimeter of the exterior closed stirrup; inactive torsion is NOT_APPLICABLE.
  - rule_id: ACI318_25_9_7_6_3_3_300_MM
    module: rc_shear_torsion.codes.aci318_25.torsion
    function: torsion_spacing_limits
    aci_section: "9.7.6.3.3"
    applicability: Active torsion.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    notes: Maximum spacing component 300 mm; inactive torsion is NOT_APPLICABLE.
  - rule_id: ACI318_25_9_7_6_4_2_TRANSVERSE_SIZE
    module: rc_shear_torsion.codes.aci318_25.ties
    function: check_transverse_reinforcement_size
    aci_section: "9.7.6.4.2"
    applicability: Longitudinal compression reinforcement is required by design.
    implemented: true
    tested: true
    test_file: tests/test_phase3_longitudinal_detailing.py
    notes: No. 10 encloses individual No. 32 or smaller bars; No. 13 encloses individual No. 36 or larger bars. Bundled longitudinal bars are outside module scope.
  - rule_id: ACI318_25_9_7_6_4_3_SIXTEEN_DB_LONGITUDINAL
    module: rc_shear_torsion.codes.aci318_25.ties
    function: tie_rule_checks
    aci_section: "9.7.6.4.3(a)"
    applicability: Longitudinal compression reinforcement is required by design.
    implemented: true
    tested: true
    test_file: tests/test_phase3_longitudinal_detailing.py
    notes: Maximum spacing component 16 times the individual longitudinal-bar diameter.
  - rule_id: ACI318_25_9_7_6_4_3_FORTY_EIGHT_DB_TRANSVERSE
    module: rc_shear_torsion.codes.aci318_25.ties
    function: tie_rule_checks
    aci_section: "9.7.6.4.3(b)"
    applicability: Longitudinal compression reinforcement is required by design.
    implemented: true
    tested: true
    test_file: tests/test_phase3_longitudinal_detailing.py
    notes: Maximum spacing component 48 times the transverse reinforcing-bar diameter.
  - rule_id: ACI318_25_9_7_6_4_3_LEAST_BEAM_DIMENSION
    module: rc_shear_torsion.codes.aci318_25.ties
    function: tie_rule_checks
    aci_section: "9.7.6.4.3(c)"
    applicability: Longitudinal compression reinforcement is required by design.
    implemented: true
    tested: true
    test_file: tests/test_phase3_longitudinal_detailing.py
    notes: Maximum spacing component is the least beam dimension.
  - rule_id: ACI318_25_9_7_6_4_4_LONGITUDINAL_BAR_ARRANGEMENT
    module: rc_shear_torsion.codes.aci318_25.ties
    function: tie_rule_checks
    aci_section: "9.7.6.4.4"
    applicability: Longitudinal compression reinforcement is required by design.
    implemented: false
    tested: true
    test_file: tests/test_phase3_longitudinal_detailing.py
    notes: NOT_EVALUATED when applicable; longitudinal bar count and transverse arrangement are outside current scope.
  - rule_id: ACI318_25_18_6_4_2_LATERAL_SUPPORT
    module: rc_shear_torsion.codes.aci318_25.ties
    function: tie_rule_checks
    aci_section: "18.6.4.2 and 25.7.2.3"
    applicability: DES region where hoops or closed stirrups are required by 18.6.4.1.
    implemented: false
    tested: true
    test_file: tests/test_phase3_longitudinal_detailing.py
    notes: NOT_EVALUATED; longitudinal bar positions, supported bars, crossties, and clear distances are outside current scope.
  - rule_id: ACI318_25_18_4_2_4_D_OVER_4
    module: rc_shear_torsion.codes.aci318_25.seismic
    function: seismic_spacing_limits
    aci_section: "18.4.2.4(a)"
    applicability: DMO confined end region.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    notes: Maximum spacing component d/4.
  - rule_id: ACI318_25_18_4_2_4_EIGHT_DB
    module: rc_shear_torsion.codes.aci318_25.seismic
    function: seismic_spacing_limits
    aci_section: "18.4.2.4(b)"
    applicability: DMO confined end region with smallest enclosed longitudinal bar identified.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    notes: Maximum spacing component 8db.
  - rule_id: ACI318_25_18_4_2_4_TWENTY_FOUR_DBT
    module: rc_shear_torsion.codes.aci318_25.seismic
    function: seismic_spacing_limits
    aci_section: "18.4.2.4(c)"
    applicability: DMO confined end region with transverse bar diameter identified.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    notes: Maximum spacing component 24 times the transverse reinforcing-bar diameter.
  - rule_id: ACI318_25_18_4_2_4_ABSOLUTE_300
    module: rc_shear_torsion.codes.aci318_25.seismic
    function: seismic_spacing_limits
    aci_section: "18.4.2.4(d)"
    applicability: DMO confined end region.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    notes: Corrected maximum spacing component is 300 mm, not 150 mm.
  - rule_id: ACI318_25_18_4_2_4_END_ZONE_LENGTH
    module: rc_shear_torsion.codes.aci318_25.seismic
    function: check_seismic_transverse_zone_extent
    aci_section: "18.4.2.4"
    applicability: DMO confined region at either beam end, measured from the face of the supporting member toward midspan.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    test_name: test_dmo_end_zone_length_passes_when_two_h_is_provided
    notes: Minimum extent is 2h, using total beam height; missing actual region length is NOT_EVALUATED.
  - rule_id: ACI318_25_18_4_2_4_FIRST_TRANSVERSE_LOCATION
    module: rc_shear_torsion.codes.aci318_25.seismic
    function: check_first_seismic_transverse_reinforcement_location
    aci_section: "18.4.2.4"
    applicability: DMO confined region at either beam end.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    test_name: test_dmo_first_stirrup_at_limit_passes
    notes: Maximum distance from the supporting-member face is 50 mm; missing actual position is NOT_EVALUATED.
  - rule_id: ACI318_25_18_4_2_5_D_OVER_2
    module: rc_shear_torsion.codes.aci318_25.seismic
    function: seismic_spacing_limits
    aci_section: "18.4.2.5"
    applicability: DMO beam outside the confined end-region overlay.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    notes: Maximum transverse reinforcement spacing d/2.
  - rule_id: ACI318_25_18_6_4_1_A_END_ZONE_LENGTH
    module: rc_shear_torsion.codes.aci318_25.seismic
    function: check_seismic_transverse_zone_extent
    aci_section: "18.6.4.1(a)"
    applicability: DES region at either beam end, measured from the face of the supporting column toward midspan.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    test_name: test_des_beam_end_region_is_identified_and_checked
    notes: Minimum extent is 2h, using total beam height; an explicit BEAM_END basis and actual region length are required.
  - rule_id: ACI318_25_18_6_4_1_B_YIELD_ZONE_EXTENSION
    module: rc_shear_torsion.codes.aci318_25.seismic
    function: check_seismic_transverse_zone_extent
    aci_section: "18.6.4.1(b)"
    applicability: DES section where inelastic flexural yielding is likely due to lateral displacement beyond the elastic range.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    test_name: test_des_probable_yielding_region_checks_two_h_on_each_side
    notes: Minimum extension is 2h on each side, using total beam height; missing region basis or side extensions is NOT_EVALUATED.
  - rule_id: ACI318_25_18_6_4_4_FIRST_TRANSVERSE_LOCATION
    module: rc_shear_torsion.codes.aci318_25.seismic
    function: check_first_seismic_transverse_reinforcement_location
    aci_section: "18.6.4.4"
    applicability: DES beam-end region at the face of a supporting column.
    implemented: true
    tested: true
    test_file: tests/test_phase2_aci_engine.py
    test_name: test_des_first_hoop_at_limit_passes
    notes: Maximum distance from the supporting-column face is 50 mm; missing actual position is NOT_EVALUATED.
  - rule_id: ACI318_25_18_6_4_4_D_OVER_4
    module: rc_shear_torsion.codes.aci318_25.seismic
