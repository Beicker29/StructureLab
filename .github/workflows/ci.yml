name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -q

      - name: Start API server
        run: |
          APP_ENV=test APP_STORAGE_DIR=.tmp_ci_storage uvicorn app.main:app --host 127.0.0.1 --port 10000 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:10000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API no respondio a tiempo"
          cat uvicorn.log
          exit 1

      - name: Run API smoke
        run: python scripts/smoke_api.py --base-url http://127.0.0.1:10000 --timeout-seconds 240

      - name: Stop API server
        if: always()
        run: |
          if [ -f uvicorn.pid ]; then
            kill "$(cat uvicorn.pid)" || true
          fi
